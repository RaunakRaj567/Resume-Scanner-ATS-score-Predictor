[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-ats-reader"
version = "1.0.0"
description = "Resume Scanner and ATS Predictor"
authors = [{ name = "Developer" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.25.0",
    "pdfplumber>=0.9.0",
    "pypdf>=3.10.0",
    "python-docx>=0.8.11",
    "rapidfuzz>=3.0.0",
    "scikit-learn>=1.2.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "pytest>=7.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
